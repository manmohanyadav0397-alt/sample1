
# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
spring.application.name=Kafka-Microservices-Order

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8081

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/order_service_db2
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:MyNewPass123!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# DATABASE INITIALIZATION
# ==========================================
spring.sql.init.mode=never

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# ACTUATOR CONFIGURATION
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==========================================
# APPLICATION INFO
# ==========================================
info.app.name=E-Commerce Order Management
info.app.description=Order Service REST API
info.app.version=1.0.0
